{% extends "base.html" %}

{% block content %}
<section class="auth-section">
    <div class="auth-card auth-card-wide">
        <span class="eyebrow">Start with a profile</span>
        <h1>Create your FitBuddy account</h1>
        <p class="form-intro">Your password is securely hashed and never stored as plain text.</p>
        <form method="post" class="form-stack" novalidate>
            <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
            <div class="form-grid form-grid-two">
                <div class="form-field">
                    <label for="name">Your name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required maxlength="100" value="{{ request.form.get('name', '') }}">
                </div>
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required maxlength="255" value="{{ request.form.get('email', '') }}">
                </div>
            </div>
            <div class="form-grid form-grid-two">
                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
                        <button type="button" class="password-toggle" data-password-toggle="#password">Show</button>
                    </div>
                    <small>Use at least 8 characters.</small>
                </div>
                <div class="form-field">
                    <label for="confirm_password">Confirm password</label>
                    <div class="password-wrap">
                        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8">
                        <button type="button" class="password-toggle" data-password-toggle="#confirm_password">Show</button>
                    </div>
                </div>
            </div>
            <button class="button button-primary button-full" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</section>
{% endblock %}
