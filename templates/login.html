{% extends "base.html" %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">Welcome back</span>
        <h1>Log in to FitBuddy</h1>
        <p class="form-intro">Continue building your personalized fitness routine.</p>
        <form method="post" class="form-stack" novalidate>
            <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
            <div class="form-field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="255" value="{{ request.form.get('email', '') }}">
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" data-password-toggle="#password">Show</button>
                </div>
            </div>
            <button class="button button-primary button-full" type="submit">Log in</button>
        </form>
        <p class="auth-switch">New to FitBuddy? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>
</section>
{% endblock %}
